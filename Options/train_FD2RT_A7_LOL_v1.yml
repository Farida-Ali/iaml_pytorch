# FD²RT A7 — LOL-v1 Training Config (full model: A4 + frequency loss + TV prior)
# ==============================================================================
# Architecture: FD2RT_A4 (W-IE + Dual-Domain DDA) — UNCHANGED from A4.
# Model wrapper: FD2RT_A7_Model (adds L_freq + L_tv_illum on top of A4).
#
# Loss:
#   L_total = L1(I_en, I_gt)          [weight 1.0,  existing pixel loss]
#           + 0.1  * L_freq           [FrequencyAwareLoss, w_low=1.0, w_high=2.0]
#           + 0.01 * L_tv_illum       [IlluminationTVLoss on W-IE LL subband]
#
# Note: A4's pipeline has NO I_lu auxiliary L1 term, so the optional
#       "0.1 * L1(I_lu, I_gt)" from the brief is omitted — the A7 delta vs A4
#       is purely the two new regularizers.
#
# Everything else (LR, iters, batch, patch, scheduler, grad-clip=1.0, seed)
# is byte-for-byte identical to train_FD2RT_A4_LOL_v1_fixed.yml.
# ------------------------------------------------------------------------------

name: train_FD2RT_A7_LOL_v1
model_type: FD2RT_A7_Model      # NEW wrapper (basicsr/models/fd2rt_a7_model.py)
scale: 1
num_gpu: 1            # set to 0 for CPU debugging
manual_seed: 100      # same seed as A4 for fair comparison

# ── Dataset ──────────────────────────────────────────────────────────── #
datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Train/target
    dataroot_lq: data/LOLv1/Train/input
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    ### Fixed 128×128 patch — same as A4 / Retinexformer LOL-v1 baseline
    mini_batch_sizes: [8]
    iters: [300000]       # must be >= total_iter; controls progressive schedule
    gt_size: 128
    gt_sizes: [128]

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

# ── Architecture (UNCHANGED from A4) ─────────────────────────────────── #
network_g:
  type: FD2RT_A4       # registered via basicsr/models/archs/fd2rt_a4_arch.py
  in_channels: 3
  out_channels: 3
  n_feat: 40           # identical to A4 / Retinexformer LOL-v1
  stage: 1
  num_blocks: [1, 2, 2]

# ── Paths ─────────────────────────────────────────────────────────────── #
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# ── Training (identical hyperparameters to A4) ───────────────────────── #
train:
  total_iter: 250000    # identical to A4
  warmup_iter: -1
  use_grad_clip: true
  clip_grad_norm: 1.0   # identical to A4

  # 2-cycle cosine schedule scaled to 250K total (identical to A4)
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [77000, 173000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]

  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]

  # ── Losses ─────────────────────────────────────────────────────────── #
  # Existing pixel loss (MAE) — identical to A4
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  # NEW: Frequency-Aware Restoration Loss (weighted 0.1)
  freq_opt:
    type: FrequencyAwareLoss
    loss_weight: 0.1
    w_low: 1.0
    w_high: 2.0
    cutoff_div: 8.0

  # NEW: Illumination Smoothness (TV) prior on the W-IE LL subband (weighted 0.01)
  tv_opt:
    type: IlluminationTVLoss
    loss_weight: 0.01

# ── Validation ───────────────────────────────────────────────────────── #
val:
  window_size: 4
  val_freq: !!float 1e3
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false

# ── Logging ──────────────────────────────────────────────────────────── #
logger:
  print_freq: 500
  save_checkpoint_freq: !!float 5e3   # save every 5K iters
  use_tb_logger: true
  wandb:
    project: fd2rt-a7
    resume_id: ~

# ── Distributed ──────────────────────────────────────────────────────── #
dist_params:
  backend: nccl
  port: 29500
