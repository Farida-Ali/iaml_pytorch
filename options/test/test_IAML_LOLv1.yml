# general settings
name: IAML_LOLv1
model_type: ImageCleanModel
scale: 1
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 100

# dataset and data loader settings
datasets:
  val:
    name: LOLv1
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

# network architecture
network_g:
  type: IAMLNet

# path
path:
  pretrain_network_g: experiments/IAML_LOLv1/best_model.pth
  param_key: model_state_dict
  strict_load_g: true

# validation settings
val:
  window_size: 32      # encoder has 5 stride-2 levels → must pad to multiples of 32
  val_freq: !!float 5e3
  save_img: true
  rgb2bgr: true
  use_image: false
  max_minibatch: 1     # test images may have different resolutions

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true    # Y channel of YCbCr, matches all published results
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true    # Y channel of YCbCr

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
